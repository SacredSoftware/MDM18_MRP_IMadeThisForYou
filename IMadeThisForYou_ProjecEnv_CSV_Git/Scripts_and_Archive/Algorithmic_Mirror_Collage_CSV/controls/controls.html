<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  </head>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #111;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #treemap-container {
        flex: 1;
        position: relative;
        width: 100%;
        overflow: hidden;
        min-height: 0;
      }
      #density-label { 
        color: #888;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      #density-bar {
        padding: 12px 16px;
        background: #1a1a1a;
        border-top: 1px solid rgba(255,255,255,0.08);
        display: flex;
        justify-content: flex-end;
      }
      #density-readout {
        color:#5bf;
        font-size: 10px;
        letter-spacing: 0.1em;
        white-space: nowrap;
        min-width: 110px;
        text-align: right;
      }
      #reset-btn {
        padding: 6px 14px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        color: #e0e0e0;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        cursor: pointer;
        white-space: nowrap;
      }
      #reset-btn-hover {
        background: rgba(85, 187, 255, 0.12);
        border-color: rgba(85, 187, 255, 0.4);
      }
  </style>
  <body>
    <div id="treemap-container">
      <canvas id="treemap-canvas"></canvas>
    </div>
    <div id="density-bar">
      <button id="reset-btn">↺ Reset</button>
    </div>
    <script src="../libs/p5.min.js"></script>
    <script src="controls.js"></script>
  </body>
</html>
